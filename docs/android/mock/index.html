<!doctype html>
<html lang="tr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meiro Android: hedef arayüz (mock)</title>
<style>
  @font-face{font-family:"Google Sans"; src:url("../meiro/fonts/GoogleSans.ttf") format("truetype"); font-weight:100 1000; font-display:swap}
  :root{
    --surface:#131317;
    --surface-container-low:#1c1b1f; --surface-container:#201f23; --surface-container-high:#2a292e; --surface-container-highest:#353439;
    --on-surface:#e2e2e7; --on-surface-variant:#c7c5d1; --outline:#918f9a; --outline-variant:#47454f;
    --primary:#c9bbff; --on-primary:#361c68; --primary-container:#4c3582; --on-primary-container:#e3ddff;
    --secondary-container:#48435c; --on-secondary-container:#e3defd;
    --tertiary-container:#643649; --on-tertiary-container:#ffd5e5;
    --error:#ffb4ab; --error-container:#93000a; --on-error-container:#ffdad6;
    --scrim:rgba(0,0,0,.55);
    --page:#0c0c0f;
    --shadow:0 1px 2px rgba(0,0,0,.30), 0 2px 6px rgba(0,0,0,.40);
    /* Google's sign-in page in the ytmlogin frame (sampled from its dark page on the emulator) */
    --w-bg:#0e0e0e; --w-text:#e8eaed; --w-sub:#9aa0a6; --w-strip:#303134; --w-url:#bdc1c6; --w-lock:#81c995; --w-line:#5f6368; --w-link:#8ab4f8; --w-btn:#a8c7fa; --w-btn-text:#062e6f;
  }
  html[data-theme="light"]{
    --surface:#f9f8fe;
    --surface-container-low:#f4f3f9; --surface-container:#eeedf3; --surface-container-high:#e8e7ed; --surface-container-highest:#e2e2e7;
    --on-surface:#1c1b1f; --on-surface-variant:#47454f; --outline:#777580; --outline-variant:#c7c5d1;
    --primary:#634d9d; --on-primary:#ffffff; --primary-container:#e3ddff; --on-primary-container:#22004e;
    --secondary-container:#e3defd; --on-secondary-container:#1d172d;
    --tertiary-container:#ffd5e5; --on-tertiary-container:#330a1e;
    --error:#ba1a1a; --error-container:#ffdad6; --on-error-container:#410002;
    --scrim:rgba(0,0,0,.35);
    --page:#e9e8ef;
    --w-bg:#ffffff; --w-text:#202124; --w-sub:#5f6368; --w-strip:#f1f3f4; --w-url:#5f6368; --w-lock:#188038; --w-line:#dadce0; --w-link:#1a73e8; --w-btn:#1a73e8; --w-btn-text:#ffffff;
    --shadow:0 1px 2px rgba(0,0,0,.10), 0 2px 6px rgba(0,0,0,.14);
  }
  *{box-sizing:border-box}
  html,body{margin:0; background:var(--page); color:var(--on-surface)}
  body{font-family:"Google Sans", system-ui, -apple-system, Roboto, sans-serif; font-size:14px; line-height:20px; letter-spacing:.2px; -webkit-font-smoothing:antialiased}
  button{font:inherit; color:inherit; cursor:pointer}
  svg{display:block}

  /* ---------- sayfa: telefon + inceleme paneli ---------- */
  .stage{display:flex; gap:40px; justify-content:center; align-items:flex-start; padding:32px 24px; min-height:100vh}
  .phone{position:sticky; top:24px; flex:none; width:390px; height:min(844px, calc(100vh - 48px)); border-radius:46px; padding:10px; background:#05050a; box-shadow:0 30px 60px rgba(0,0,0,.35)}
  .screenbox{position:relative; width:100%; height:100%; border-radius:37px; overflow:hidden; background:var(--surface)}
  .review{width:420px; max-width:100%}
  .review h1{font-size:24px; line-height:32px; margin:0 0 4px; font-weight:600}
  .review .lead{color:var(--on-surface-variant); margin:0 0 18px}
  .review .ctl{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:22px}
  .review h2{font-size:12px; letter-spacing:.8px; text-transform:uppercase; color:var(--on-surface-variant); margin:22px 0 8px; font-weight:600}
  .jump{display:block; width:100%; text-align:left; border:0; background:transparent; padding:10px 12px; border-radius:12px}
  .jump b{display:block; font-weight:500}
  .jump span{display:block; font-size:12px; line-height:16px; color:var(--on-surface-variant)}
  .jump:hover{background:var(--surface-container-high)}
  .jump.on{background:var(--secondary-container); color:var(--on-secondary-container)}
  .jump.on span{color:inherit; opacity:.8}
  .tog{border:1px solid var(--outline-variant); background:transparent; border-radius:9999px; padding:6px 14px; font-size:13px}
  .tog.on{background:var(--secondary-container); color:var(--on-secondary-container); border-color:transparent}
  @media (max-width:900px){
    .stage{display:block; padding:0}
    .phone{position:relative; top:0; width:100%; height:100vh; height:100dvh; border-radius:0; padding:0; box-shadow:none}
    .screenbox{border-radius:0}
    .review{padding:24px 16px 48px; width:auto}
  }

  /* ---------- uygulama iskeleti ---------- */
  .app{position:absolute; inset:0; display:flex; flex-direction:column}
  .statusbar{height:36px; flex:none; display:flex; align-items:center; justify-content:space-between; padding:6px 26px 0; font-size:13px; font-weight:500}
  .statusbar .sys{display:flex; gap:6px; align-items:center}
  .statusbar .sys i{display:block; width:16px; height:10px; border-radius:2px; background:var(--on-surface); opacity:.85}
  .content{flex:1; overflow-y:auto; overflow-x:hidden; position:relative; scrollbar-width:none}
  .content::-webkit-scrollbar{display:none}
  .banner{display:flex; align-items:center; gap:10px; margin:0 16px 8px; padding:10px 14px; border-radius:14px; background:var(--surface-container-high); font-size:13px; color:var(--on-surface-variant)}
  .banner svg{width:18px; height:18px; fill:currentColor; flex:none}

  .topbar{position:sticky; top:0; z-index:3; display:flex; align-items:center; gap:6px; height:64px; padding:0 8px 0 16px; background:var(--surface)}
  .topbar.withback{padding-left:4px}
  .topbar h1{flex:1; min-width:0; margin:0; font-size:22px; line-height:28px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .ibtn{width:48px; height:48px; border:0; background:transparent; border-radius:50%; display:grid; place-items:center; color:var(--on-surface-variant); flex:none}
  .ibtn svg{width:24px; height:24px; fill:currentColor}
  .ibtn:active{background:var(--surface-container-high)}
  .avatar{width:32px; height:32px; border-radius:50%; background:var(--primary-container); color:var(--on-primary-container); display:grid; place-items:center; font-size:13px; font-weight:600}

  .navbar{flex:none; height:80px; display:flex; background:var(--surface-container); padding:12px 0 16px}
  .nav{flex:1; border:0; background:transparent; display:flex; flex-direction:column; align-items:center; gap:4px; font-size:12px; font-weight:500; color:var(--on-surface-variant)}
  .nav .pill{width:64px; height:32px; border-radius:16px; display:grid; place-items:center}
  .nav svg{width:24px; height:24px; fill:currentColor}
  .nav.on{color:var(--on-surface)}
  .nav.on .pill{background:var(--secondary-container); color:var(--on-secondary-container)}
  .gesture{position:absolute; left:50%; bottom:6px; transform:translateX(-50%); width:108px; height:4px; border-radius:2px; background:var(--on-surface); opacity:.45; z-index:30; pointer-events:none}

  /* mini oynatici */
  .mini{flex:none; position:relative; margin:0 8px 8px; height:64px; border-radius:16px; background:var(--surface-container-high); display:flex; align-items:center; gap:12px; padding:0 4px 0 8px; overflow:hidden}
  .mini .cv{width:48px; height:48px; border-radius:10px; flex:none}
  .mini .t{flex:1; min-width:0}
  .mini .t b{display:block; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .mini .t span{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--on-surface-variant); white-space:nowrap; overflow:hidden}
  .mini .bar{position:absolute; left:12px; right:12px; bottom:0; height:2px; background:var(--outline-variant); border-radius:1px}
  .mini .bar i{display:block; height:100%; width:38%; background:var(--primary); border-radius:1px}
  /* calinamayan sarki: nedeni sanatcinin yerinde, hata renginde; cubuk bos */
  .mini .t span.err{color:var(--error)}
  .mini .t span.err em{font-style:normal; min-width:0; overflow:hidden; text-overflow:ellipsis}
  .mini .bar i.z{width:0}
  .mini .ibtn{color:var(--on-surface)}
  .spinner{width:22px; height:22px; border-radius:50%; border:3px solid var(--outline-variant); border-top-color:var(--primary); animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ---------- ortak parcalar ---------- */
  .pad{padding:0 16px}
  .h-sec{display:flex; align-items:center; justify-content:space-between; padding:20px 16px 10px}
  .h-sec h2{margin:0; font-size:20px; line-height:26px; font-weight:500}
  .h-sec .more{font-size:13px; color:var(--primary); border:0; background:transparent; font-weight:500}
  .hello{padding:4px 16px 4px; font-size:28px; line-height:36px; font-weight:500}
  .sub{color:var(--on-surface-variant); font-size:13px}
  .shelf{display:flex; gap:12px; overflow-x:auto; padding:0 16px 4px; scrollbar-width:none}
  .shelf::-webkit-scrollbar{display:none}
  .tile{width:140px; flex:none}
  .tile .art{width:140px; height:140px; border-radius:14px; position:relative}
  .tile .art .badge{position:absolute; left:8px; bottom:8px; display:grid}
  .tile b{display:block; margin-top:8px; font-weight:500; line-height:18px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
  .tile span{display:block; font-size:12px; line-height:16px; color:var(--on-surface-variant); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .badge{display:inline-grid; place-items:center; width:22px; height:22px; border-radius:50%; background:rgba(0,0,0,.55)}
  .badge svg{width:14px; height:14px}

  .row{display:flex; align-items:center; gap:12px; min-height:64px; padding:8px 4px 8px 16px; border-radius:0; position:relative}
  .row:active{background:var(--surface-container)}
  .row.now{background:color-mix(in srgb, var(--primary) 12%, transparent)}
  .row.now .t b{color:var(--primary)}
  .row .cv{width:48px; height:48px; border-radius:8px; flex:none; position:relative}
  .row .cv.round{border-radius:50%}
  .row .cv .eq{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; gap:3px; background:rgba(0,0,0,.45); border-radius:inherit}
  .row .cv .eq i{width:3px; background:#fff; border-radius:2px; animation:eq 1s ease-in-out infinite}
  .row .cv .eq i:nth-child(2){animation-delay:.2s} .row .cv .eq i:nth-child(3){animation-delay:.4s}
  @keyframes eq{0%,100%{height:6px}50%{height:16px}}
  .row .t{flex:1; min-width:0}
  .row .t b{display:block; font-weight:400; font-size:16px; line-height:22px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .row .t .meta{display:flex; align-items:center; gap:6px; font-size:13px; line-height:18px; color:var(--on-surface-variant); white-space:nowrap; overflow:hidden}
  .row .t .meta .txt{overflow:hidden; text-overflow:ellipsis}
  .row .t .why{display:block; font-size:12px; line-height:16px; color:var(--primary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .row .num{width:24px; text-align:center; color:var(--on-surface-variant); flex:none}
  .row .drag{width:24px; height:24px; fill:var(--on-surface-variant); flex:none}
  .src{display:inline-flex; align-items:center; gap:2px; flex:none}
  .src svg{width:14px; height:14px}
  .src .dim{opacity:.35}
  .dl{width:14px; height:14px; fill:var(--primary); flex:none}
  .chip{flex:none; height:24px; padding:0 10px; border-radius:8px; border:1px solid var(--outline-variant); background:transparent; font-size:12px; color:var(--on-surface-variant); display:inline-flex; align-items:center; gap:4px}
  .chip svg{width:14px; height:14px; fill:currentColor}
  .chip.other{border-style:dashed}
  .linkbtn{flex:none; width:32px; height:32px; border-radius:50%; border:1px solid var(--outline); background:transparent; display:grid; place-items:center; color:var(--on-surface-variant); padding:0}
  .linkbtn svg{width:18px; height:18px; fill:currentColor}
  .linkbtn.other{border-style:dashed; opacity:.7}
  .np .linkbtn{color:#fff; border-color:rgba(255,255,255,.5)}
  .chip.sel{background:var(--secondary-container); color:var(--on-secondary-container); border-color:transparent}
  .chips{display:flex; gap:8px; overflow-x:auto; padding:4px 16px 8px; scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chips .chip{height:32px; padding:0 14px; font-size:13px; border-radius:8px}

  .btn{height:40px; padding:0 20px; border-radius:20px; border:0; font-weight:500; display:inline-flex; align-items:center; gap:8px; flex:none}
  .btn svg{width:18px; height:18px; fill:currentColor}
  .btn.filled{background:var(--primary); color:var(--on-primary)}
  .btn.tonal{background:var(--secondary-container); color:var(--on-secondary-container)}
  .btn.outlined{background:transparent; border:1px solid var(--outline); color:var(--primary)}
  .btn.text{background:transparent; color:var(--primary); padding:0 12px}
  .btn.block{width:100%; justify-content:center; height:48px; border-radius:24px}

  .card{margin:0 16px; border-radius:20px; background:var(--surface-container-low); overflow:hidden}
  .mix{margin:4px 16px 0; border-radius:24px; padding:16px; display:flex; gap:14px; align-items:center; color:#fff; position:relative; overflow:hidden}
  .mix .cv{width:96px; height:96px; border-radius:16px; flex:none; display:grid; grid-template-columns:1fr 1fr; overflow:hidden; box-shadow:0 4px 14px rgba(0,0,0,.3)}
  .mix .cv i{display:block}
  .mix .k{font-size:12px; letter-spacing:.6px; text-transform:uppercase; opacity:.85}
  .mix h3{margin:2px 0 4px; font-size:22px; line-height:28px; font-weight:600}
  .mix > div:nth-child(2){min-width:0; padding-right:52px}
  .mix p{margin:0 0 10px; font-size:13px; line-height:18px; opacity:.9}
  .mix .play{width:48px; height:48px; border-radius:50%; border:0; background:#fff; color:#1c1b1f; display:grid; place-items:center; position:absolute; right:16px; bottom:16px}
  .mix .play svg{width:26px; height:26px; fill:currentColor}

  .hero{padding:8px 16px 4px; text-align:center}
  .hero .big{width:220px; height:220px; border-radius:20px; margin:0 auto 16px; box-shadow:0 10px 30px rgba(0,0,0,.35)}
  .hero .big.round{border-radius:50%}
  .hero h2{margin:0; font-size:24px; line-height:30px; font-weight:600}
  .hero .kind{display:flex; justify-content:center; align-items:center; gap:6px; margin-top:6px; color:var(--on-surface-variant); font-size:13px}
  .hero .actions{display:flex; justify-content:center; align-items:center; gap:4px; margin:14px 0 6px}
  .hero .actions .play{width:56px; height:56px; border-radius:18px; border:0; background:var(--primary); color:var(--on-primary); display:grid; place-items:center; margin:0 8px; flex:none}
  /* Beside two labelled buttons (artist) there is no room for the side margins: the gap is enough. */
  .hero .actions .btn + .play{margin:0}
  .hero .actions .play svg{width:28px; height:28px; fill:currentColor}
  .tools{display:flex; align-items:center; gap:8px; padding:6px 8px 6px 16px}
  .tools .grow{flex:1}

  .searchbar{margin:8px 16px 8px; height:56px; border-radius:28px; background:var(--surface-container-high); display:flex; align-items:center; gap:4px; padding:0 4px 0 16px; color:var(--on-surface-variant)}
  .searchbar svg{width:24px; height:24px; fill:currentColor; flex:none}
  .searchbar input{flex:1; min-width:0; border:0; outline:0; background:transparent; color:var(--on-surface); font:inherit; font-size:16px; margin-left:8px}
  .recent{display:flex; align-items:center; gap:14px; height:52px; padding:0 8px 0 20px; color:var(--on-surface)}
  .recent svg{width:22px; height:22px; fill:var(--on-surface-variant); flex:none}
  .recent span{flex:1}

  .tabs{display:flex; position:sticky; top:64px; z-index:2; background:var(--surface); border-bottom:1px solid var(--outline-variant)}
  .tabs button{flex:1; height:48px; border:0; background:transparent; font-weight:500; color:var(--on-surface-variant); position:relative}
  .tabs button.on{color:var(--primary)}
  .tabs button.on::after{content:""; position:absolute; left:28%; right:28%; bottom:0; height:3px; border-radius:3px 3px 0 0; background:var(--primary)}

  .fab{position:absolute; right:16px; bottom:168px; height:56px; padding:0 20px 0 16px; border-radius:16px; border:0; background:var(--primary-container); color:var(--on-primary-container); display:flex; align-items:center; gap:10px; font-weight:500; box-shadow:var(--shadow); z-index:4}
  .fab svg{width:24px; height:24px; fill:currentColor}

  .meter{margin:4px 16px 8px; padding:16px; border-radius:20px; background:var(--surface-container-low)}
  .meter .bar{height:8px; border-radius:4px; background:var(--surface-container-highest); display:flex; overflow:hidden; margin:10px 0 8px}
  .meter .bar i{display:block; height:100%}
  .meter .legend{display:flex; gap:14px; font-size:12px; color:var(--on-surface-variant); flex-wrap:wrap}
  .meter .legend span::before{content:""; display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; background:var(--c)}
  .prog{height:4px; border-radius:2px; background:var(--surface-container-highest); margin-top:6px; overflow:hidden}
  .prog i{display:block; height:100%; background:var(--primary)}

  .empty{padding:56px 32px; text-align:center; color:var(--on-surface-variant)}
  .empty > svg{width:56px; height:56px; fill:var(--outline); margin:0 auto 14px}
  .empty b{display:block; color:var(--on-surface); font-size:18px; font-weight:500; margin-bottom:6px}
  .empty p{margin:0 0 18px}
  .skel{background:linear-gradient(90deg, var(--surface-container) 0%, var(--surface-container-high) 50%, var(--surface-container) 100%); background-size:200% 100%; animation:sk 1.4s ease-in-out infinite; border-radius:8px}
  @keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}

  /* ayarlar */
  .sgroup{padding:22px 16px 8px; font-size:13px; font-weight:500; color:var(--primary)}
  .srow{display:flex; align-items:center; gap:14px; min-height:64px; padding:10px 16px}
  .srow > svg{width:24px; height:24px; fill:var(--on-surface-variant); flex:none}
  .srow .k{flex:1; min-width:0}
  .srow .k b{display:block; font-weight:400; font-size:16px; line-height:22px}
  .srow .k span{display:block; font-size:13px; line-height:18px; color:var(--on-surface-variant)}
  .srow .k b .tag{display:inline-block; vertical-align:2px; margin-left:6px; color:var(--on-surface-variant)}
  .sw{width:52px; height:32px; border-radius:16px; background:var(--surface-container-highest); border:2px solid var(--outline); position:relative; flex:none}
  .sw::after{content:""; position:absolute; left:6px; top:6px; width:16px; height:16px; border-radius:50%; background:var(--outline); transition:.15s}
  .sw.on{background:var(--primary); border-color:var(--primary)}
  .sw.on::after{left:22px; top:2px; width:24px; height:24px; background:var(--on-primary)}
  .seg{display:flex; border:1px solid var(--outline); border-radius:20px; overflow:hidden; height:40px; margin:4px 16px 8px}
  .seg button{flex:1; border:0; background:transparent; font-size:13px; font-weight:500}
  .seg button+button{border-left:1px solid var(--outline)}
  .seg button.on{background:var(--secondary-container); color:var(--on-secondary-container)}
  .swatches{display:flex; gap:10px; padding:4px 16px 10px}
  .swatches i{width:36px; height:36px; border-radius:50%; display:block; border:3px solid transparent}
  .swatches i.on{border-color:var(--on-surface)}
  .slider{flex:none; width:120px; height:4px; border-radius:2px; background:var(--surface-container-highest); position:relative}
  .slider i{position:absolute; left:0; top:0; bottom:0; border-radius:2px; background:var(--primary)}
  .slider b{position:absolute; top:-8px; width:4px; height:20px; border-radius:2px; background:var(--primary)}
  .field{margin:6px 16px 10px; border:1px solid var(--outline); border-radius:6px; padding:10px 14px 8px; position:relative}
  .field label{position:absolute; top:-9px; left:10px; padding:0 4px; font-size:12px; color:var(--on-surface-variant); background:var(--surface)}
  .field input{width:100%; border:0; outline:0; background:transparent; color:var(--on-surface); font:inherit; font-size:16px}
  .field.focus{border:2px solid var(--primary)}
  .field.focus label{color:var(--primary)}
  .note{margin:6px 16px; font-size:12px; line-height:17px; color:var(--on-surface-variant)}

  .row .t .why.muted{color:var(--on-surface-variant); font-variant-numeric:tabular-nums}
  .hrow.skip .row{opacity:.55}
  /* An artist page's recording with no link to play it from (MusicBrainz names no YouTube or SoundCloud page): faded as
     a skipped play is, without source logos or the menu (artists.go: greyed, "No link"). */
  .row.na{opacity:.55}
  /* istatistik */
  .stat{display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:0 16px}
  .stat > div{background:var(--surface-container-low); border-radius:18px; padding:14px}
  .stat b{display:block; font-size:26px; line-height:32px; font-weight:600}
  .stat span{font-size:12px; color:var(--on-surface-variant)}
  .bars{display:flex; align-items:flex-end; gap:6px; height:120px; margin:0 16px; padding:14px; border-radius:18px; background:var(--surface-container-low)}
  .bars i{flex:1; border-radius:4px 4px 2px 2px; background:var(--primary); opacity:.85}
  .bars i.lo{opacity:.35}
  .rank{display:flex; align-items:center; gap:12px; padding:8px 16px}
  .rank .n{width:22px; color:var(--on-surface-variant); font-weight:600}

  .rank .t span{display:block; font-size:12px; color:var(--on-surface-variant); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}

  /* ---------- tam oynatici ---------- */

  .np .bg{position:absolute; inset:0; z-index:-1}
  .np .bg::after{content:""; position:absolute; inset:0; background:linear-gradient(180deg, rgba(0,0,0,.15), rgba(0,0,0,.55) 70%, rgba(0,0,0,.7))}
  .np .top{display:flex; align-items:center; padding:36px 8px 0}
  .np .top .ctx{flex:1; text-align:center; font-size:12px; line-height:16px}
  .np .top .ctx span{display:block; opacity:.75; letter-spacing:.6px; text-transform:uppercase; font-size:11px}
  .np .ibtn{color:#fff}
  .np .art{width:326px; max-width:calc(100% - 48px); aspect-ratio:1; margin:18px auto 0; border-radius:22px; box-shadow:0 16px 40px rgba(0,0,0,.45); position:relative}
  .np .art .prep{position:absolute; inset:0; display:grid; place-items:center; background:rgba(0,0,0,.4); border-radius:inherit; font-size:13px; text-align:center}
  .np .art .prep .spinner{margin:0 auto 10px; border-color:rgba(255,255,255,.3); border-top-color:#fff}
  .np .info{display:flex; align-items:center; gap:8px; padding:22px 24px 0}
  .np .info .t{flex:1; min-width:0}
  .np .info h2{margin:0; font-size:22px; line-height:28px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .np .info .a{opacity:.8; font-size:15px}
  .np .info .linkchip{margin-top:6px; display:inline-flex}
  .np .chip{color:#fff; border-color:rgba(255,255,255,.4)}
  .provsw{display:flex; gap:8px; padding:12px 24px 0}
  .provsw button{display:flex; align-items:center; gap:6px; height:32px; padding:0 12px 0 8px; border-radius:16px; border:1px solid rgba(255,255,255,.35); background:transparent; color:#fff; font-size:12px}

  .provsw button.on{background:rgba(255,255,255,.92); color:#1c1b1f; border-color:transparent}
  .provsw button.na{opacity:.4}

  .seek .line i{position:absolute; left:0; top:0; bottom:0; width:38%; background:#fff; border-radius:2px}
  .seek .line b{position:absolute; left:38%; top:-6px; width:16px; height:16px; margin-left:-8px; border-radius:50%; background:#fff}
  .seek .times{display:flex; justify-content:space-between; font-size:12px; opacity:.8; margin-top:8px}
  .ctrls{display:flex; align-items:center; justify-content:space-between; padding:6px 20px 0}

  .ctrls .ibtn.act{color:#fff; opacity:1}

  .np .lowtabs button{border:0; background:transparent; color:#fff; font-weight:500; font-size:13px; letter-spacing:.4px; text-transform:uppercase; opacity:.85; padding:12px}

  .sheet .shead h3{flex:1; margin:0; font-size:20px; line-height:26px; font-weight:500}
  .sheet .sbody{overflow-y:auto; flex:1; min-height:0}
  .sheet .div{height:1px; background:var(--outline-variant); margin:4px 0}
  .mi{display:flex; align-items:center; gap:16px; width:100%; height:52px; padding:0 20px; border:0; background:transparent; text-align:left; font-size:15px}
  .mi svg{width:24px; height:24px; fill:var(--on-surface-variant); flex:none}
  .mi .r{margin-left:auto; display:flex; gap:6px; align-items:center; font-size:12px; color:var(--on-surface-variant)}
  .mi:active{background:var(--surface-container-high)}
  .mi.warn{color:var(--error)} .mi.warn svg{fill:var(--error)}
  .acts{display:flex; gap:8px; padding:14px 16px 0; flex-wrap:wrap; flex:none}
  .acts .sp{flex:1}
  .res{display:flex; align-items:center; gap:12px; padding:10px 16px; border:0; background:transparent; width:100%; text-align:left}
  .res .cv{width:44px; height:44px; border-radius:8px; flex:none}

  .res.sel .radio::after{content:""; position:absolute; inset:3px; border-radius:50%; background:var(--primary)}

  .fillcol .webview{flex:1; display:flex; flex-direction:column}
  .fillcol .webview .body{flex:1}

function plRows(ids){
  const q = (st.plQ || '').toLocaleLowerCase('tr');
  let r = ids.filter(id => !q || (DB[id].t + ' ' + DB[id].a).toLocaleLowerCase('tr').includes(q));
  const key = [null, id => DB[id].t, id => DB[id].a, id => secs(DB[id].d)][st.plSort];
  if (key) r = r.slice().sort((x, y) => { const a = key(x), b = key(y); return typeof a === 'number' ? a - b : a.localeCompare(b, 'tr', {sensitivity:'base'}) || DB[x].t.localeCompare(DB[y].t, 'tr'); });
  return st.plDesc ? r.reverse() : r;
}

V.history = () => {
  const f = st.histFilter;
  const q = (st.histQ || '').toLocaleLowerCase('tr');
  const keep = e => (!q || (DB[e[1]].t + ' ' + DB[e[1]].a).toLocaleLowerCase('tr').includes(q)) && (f === 'Hepsi' || (f === 'Sayılanlar' ? e[3] !== 'skip' : f === 'Geçilenler' ? e[3] === 'skip' : f === DEV[e[2]] ));
  let h = topbar('Dinleme geçmişi', {back:true, noAvatar:true, right:'<button class="ibtn" data-act="hsearch" aria-label="Geçmişte ara">' + I('search') + '</button><button class="ibtn" data-act="sheet" data-k="histmenu" aria-label="Seçenekler">' + I('more') + '</button>'}) +
    (st.histSearch ? '<label class="searchbar">' + I('search') + '<input id="hq" placeholder="Geçmişte ara" value="' + (st.histQ || '') + '"><button class="ibtn" data-act="hsearch" aria-label="Kapat">' + I('close') + '</button></label>' : '') +
    '<div class="chips">' + ['Hepsi','Sayılanlar','Geçilenler','telefon','masaüstü'].map(x => '<button class="chip' + (f === x ? ' sel' : '') + '" data-act="hfilter" data-f="' + x + '">' + (f === x ? I('check') : '') + (x === 'telefon' ? 'Telefon' : x === 'masaüstü' ? 'Masaüstü' : x) + '</button>').join('') + '</div>';
  for (const [day, list] of HIST) {
    const rows = list.filter(keep);
    if (!rows.length) continue;
    const mins = rows.filter(e => e[3] !== 'skip').length * 4;
    h += '<div class="h-sec"><h2>' + day + '</h2><span class="sub">' + rows.length + ' çalma · ~' + mins + ' dk</span></div>';
    h += rows.map(e => '<div class="hrow' + (e[3] === 'skip' ? ' skip' : '') + '">' +
      songRow(e[1], {sub: DB[e[1]].a, note: e[0] + ' · ' + DEV[e[2]] + ' · ' + e[4]}) + '</div>').join('');
  }
  return h + '<div class="note">Bütün cihazlardaki çalmalar, Meiro hesabından. 30 saniyeden kısa ya da yarısından az dinlenenler soluk: geçmişte durur ama Özet\'e ve önerilere sayılmaz.</div><div style="height:24px"></div>';
};

/* Page-to-page motion (Android-style slide, shared axis X): a new page slides in from the right with a short fade, Back
   slides the page out to the right. 300 ms, the same easing as the sheets and the player. Only taps animate; goTo (the
   state jumps and the reference screens) stays static, and a settled page is the same as before. */
const NAV_MS = 300, NAV_EASE = 'cubic-bezier(.2,0,0,1)';
function navSlide(dir, change){
  const c = $('content'), app = c.parentNode, old = c.cloneNode(true);
  old.removeAttribute('id'); old.style.cssText = 'position:absolute; left:0; right:0; z-index:5; pointer-events:none; background:var(--surface); top:' + c.offsetTop + 'px; height:' + c.offsetHeight + 'px';
  const top = c.scrollTop;
  change();
  if (!c.animate) return;
  app.insertBefore(old, c); old.scrollTop = top;
  const slide = (el, from, to, ms) => el.animate([{transform: 'translateX(' + from + ')'}, {transform: 'translateX(' + to + ')'}], {duration: ms, easing: NAV_EASE, fill: 'both'});
  const fade = (el, from, to, ms) => el.animate([{opacity: from}, {opacity: to}], {duration: ms, easing: 'linear', fill: 'both'});
  let done;
  if (dir > 0) { slide(c, '100%', '0', NAV_MS); fade(c, 0, 1, 150); slide(old, '0', '-25%', NAV_MS); done = fade(old, 1, 0, 150); }
  else { slide(old, '0', '100%', NAV_MS); done = fade(old, 1, 0, 200); slide(c, '-25%', '0', NAV_MS); fade(c, 0, 1, 150); }
  old.style.zIndex = dir > 0 ? 1 : 5; c.style.position = 'relative'; c.style.zIndex = dir > 0 ? 5 : 1;
  setTimeout(() => { old.remove(); c.style.position = c.style.zIndex = ''; c.getAnimations().forEach(a => a.cancel()); }, NAV_MS + 30);
}

function reset(){ st.npOpen = false; st.preparing = false; if (st.err) { st.err = ''; st.now = 's10'; st.playing = true; } closeSheet(); $('lock').classList.remove('open'); }
function goTo(key){
  current = key;
  reset();
  const tabs = ['home','search','library','downloads'];
  st.searchDone = false; st.stack = []; st.histFilter = 'Hepsi'; st.libTab = 'meiro'; st.plSearch = false; st.plQ = ''; st.plSort = 0; st.plDesc = false;
  if (key !== 'offline') st.online = $('tNet').classList.contains('on');
  if (tabs.includes(key)) { st.tab = key; }
  // The Library's YouTube Music tab (shown only with a YouTube Music sign-in).
  else if (key === 'library-ytm') { st.tab = 'library'; st.libTab = 'ytm'; }
  else if (key === 'search-done') { st.tab = 'search'; st.search = 'daft punk'; st.searchDone = true; }
  else if (key === 'offline') { st.online = false; st.tab = 'search'; st.search = 'gece'; st.searchDone = true; }
  else if (['np','np-prep','upnext','lyrics','related'].includes(key)) {
    st.npOpen = true; st.preparing = key === 'np-prep';
    if (['upnext','lyrics','related'].includes(key)) { st.qTab = key; render(); openSheet('qsheet'); return; }
  }
  else if (key === 'histmenu' || key === 'clearhist') { st.tab = 'home'; st.histFilter = 'Hepsi'; st.stack = ['history']; render(); openSheet(key); return; }
  else if (key === 'lock') { render(); renderLock(); $('lock').classList.add('open'); return; }
  // Nothing after it in the queue (or 3 tracks in a row failed): the track stays, with its reason.
  else if (key === 'playerr') { st.tab = 'library'; st.stack = ['empty']; st.now = 's12'; st.err = DB.s12.bad; st.playing = false; }
  // The playlist page with its search open and "ka" typed, and its order sheet.
  else if (key === 'plsearch') { st.stack = ['playlist']; st.plSearch = true; st.plQ = 'ka'; }
  else if (key === 'plsort') { st.stack = ['playlist']; render(); openSheet('plsort'); return; }
  else if (['menu','link','addto','account','dellist'].includes(key)) { st.tab = 'library'; st.stack = ['playlist']; render(); openSheet(key, key === 'account' ? null : 's7'); return; }
  else {
    // A state screen belongs to the tab it stands in for.
    if (key === 'empty') st.tab = 'library';
    if (key === 'error') st.tab = 'search';
    st.stack = [key];
  }
  render();
  $('content').scrollTop = 0;
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) { if (e.target.id === 'scrim') closeSheet(); return; }
  const a = el.dataset.act, id = el.dataset.id;
  e.stopPropagation();
  switch (a){
    case 'tab': st.tab = el.dataset.t; st.stack = []; st.searchDone = false; current = el.dataset.t; render(); $('content').scrollTop = 0; break;
    case 'back': navSlide(-1, () => { st.stack.pop(); render(); }); break;
    // The app finishes the sign-in by itself once Google's page has set the session cookie (SAPISID): it reads the
    // cookie, clears the page's cookies and storage, asks YouTube Music who it is and goes back to Ayarlar. Here a tap
    // on the page's button stands in for that. If YouTube Music does not take the session the page stays and the
    // snack says why ("YouTube Music girişi olmadı: …").
    case 'ytm-in': st.ytm = true; st.stack.pop(); render(); snack('YouTube Music\'e girildi · Murat K.'); break;
    case 'ytm-out': st.ytm = false; render(); snack('YouTube Music oturumu kapatıldı'); break;
    case 'go': if (el.dataset.to === 'history') { st.histFilter = 'Hepsi'; st.histSearch = false; st.histQ = ''; } navSlide(1, () => { st.stack.push(el.dataset.to); current = el.dataset.to; st.npOpen = false; render(); $('content').scrollTop = 0; }); break;
    case 'go-close': closeSheet(); st.npOpen = false; navSlide(1, () => { st.stack.push(el.dataset.to); render(); $('content').scrollTop = 0; }); break;
    case 'open-playlist': st.plSearch = false; st.plQ = ''; st.plSort = 0; st.plDesc = false; navSlide(1, () => { st.stack.push('playlist'); render(); $('content').scrollTop = 0; }); break;
    case 'psearch': st.plSearch = !st.plSearch; st.plQ = ''; render(); if (st.plSearch) $('pq').focus(); break;
    case 'plsort': { const f = +el.dataset.f; if (st.plSort === f) st.plDesc = !st.plDesc; else st.plSort = f; closeSheet(); render(); break; }
    // Android's share sheet with the album's YouTube Music link (the desktop's "Copy link"); nothing to show here.
    case 'share': break;
    // The app takes its colours from the wallpaper (Android 12+) or from the chosen swatch.
    case 'wall': st.wall = !st.wall; render(); break;
    case 'swatch': st.seed = el.dataset.c; st.wall = false; render(); break;
    case 'open-mix': navSlide(1, () => { st.stack.push('mix'); render(); $('content').scrollTop = 0; }); break;
    case 'open-album': navSlide(1, () => { st.stack.push('album'); render(); $('content').scrollTop = 0; }); break;
    case 'open-artist': navSlide(1, () => { st.stack.push('artist'); render(); $('content').scrollTop = 0; }); break;
    case 'play':
      if (st.now === id) { st.npOpen = true; render(); break; }
      // A track that cannot play is passed over for the next one, and a snack says why (the desktop's notice).
      if (DB[id].bad) { st.err = ''; snack('“' + DB[id].t + '” geçildi: ' + DB[id].bad.replace(/\.$/, '')); break; }
      st.now = id; st.playing = true; st.preparing = !DB[id].dl && st.online;
      render();
      if (st.preparing) setTimeout(() => { st.preparing = false; render(); }, 1800);
      break;
    case 'play-mix': st.now = 's10'; st.playing = true; render(); snack('Daily mix çalıyor'); break;
    case 'toggle': if (!st.preparing) { st.playing = !st.playing; render(); } break;
    case 'next': { const k = Object.keys(DB); st.now = k[(k.indexOf(st.now) + 1) % k.length]; render(); break; }
    case 'prev': { const k = Object.keys(DB); st.now = k[(k.indexOf(st.now) + k.length - 1) % k.length]; render(); break; }
    case 'open-np': st.npOpen = true; render(); break;
    case 'close-np': st.npOpen = false; render(); break;
    case 'src': if (DB[st.now].srcs.includes(el.dataset.src)) { st.src[st.now] = el.dataset.src; st.preparing = true; render(); setTimeout(() => { st.preparing = false; render(); }, 1200); } else snack(NAMES[el.dataset.src] + '\'da bu şarkı bulunamadı'); break;
    case 'like': case 'like-in': st.liked[st.now] = !st.liked[st.now]; render(); if (a === 'like-in') closeSheet(); break;
    case 'menu': openSheet('menu', id); break;
    case 'link': openSheet('link', id); break;
    case 'sheet': openSheet(el.dataset.k, id); break;
    case 'account': openSheet('account'); break;
    case 'listmenu': openSheet('listmenu'); break;
    case 'new-playlist': openSheet('newlist'); break;
    case 'qsheet': st.qTab = el.dataset.q; openSheet('qsheet'); break;
    case 'qtab': st.qTab = el.dataset.q; $('sheet').innerHTML = '<div class="handle"></div>' + SHEET.qsheet(); break;
    case 'close-sheet': closeSheet(); break;
    case 'mbsel': st.mbSel = +el.dataset.i; $('sheet').querySelectorAll('.res').forEach((r, i) => r.classList.toggle('sel', i === st.mbSel)); break;
    case 'mb-ok': DB.s7.st = 'matched'; closeSheet(); render(); snack('Bağlandı · bütün cihazlarda görünür'); break;
    case 'mb-other': DB.s7.st = 'other'; closeSheet(); render(); snack('"Diğer" olarak işaretlendi'); break;
    case 'snack': closeSheet(); snack(el.dataset.m); break;
    case 'hide-snack': $('snack').classList.remove('open'); break;
    case 'libtab': st.libTab = el.dataset.t; render(); break;
    case 'filter': st.filter = el.dataset.f; render(); break;
    case 'hfilter': st.histFilter = el.dataset.f; render(); break;
    case 'do-search': st.search = el.dataset.q; st.searchDone = true; render(); break;
    case 'clear-search': st.search = ''; st.searchDone = false; render(); break;
    case 'period': st.statsPeriod = el.dataset.p; render(); break;
    case 'hsearch': st.histSearch = !st.histSearch; st.histQ = ''; render(); if (st.histSearch) $('hq').focus(); break;
    case 'hpause': st.histPaused = !st.histPaused; closeSheet(); snack(st.histPaused ? 'Geçmiş kaydı duraklatıldı' : 'Geçmiş kaydı sürdürüldü'); break;
    case 'dup': snack('“Random Access Memories” Meiro listesi olarak kopyalandı'); break;
    case 'signin-ok': goTo('home'); break;
    case 'unlock': $('lock').classList.remove('open'); break;
    case 'jump': goTo(el.dataset.s); break;
  }
});
document.addEventListener('keydown', e => {
  if (e.target.id === 'q' && e.key === 'Enter') { st.search = e.target.value; st.searchDone = !!st.search; render(); }
  if (e.target.id === 'hq' && e.key === 'Enter') { st.histQ = e.target.value; render(); }
  if (e.target.id === 'pq' && e.key === 'Enter') { st.plQ = e.target.value; render(); $('pq').focus(); }
});
$('scrim').addEventListener('click', closeSheet);

/* inceleme paneli */
$('jumps').innerHTML = SCREENS.map(g => '<h2>' + g[0] + '</h2>' + g[1].map(s => '<button class="jump" data-act="jump" data-s="' + s[0] + '"><b>' + s[1] + '</b><span>' + s[2] + '</span></button>').join('')).join('');
$('tTheme').onclick = () => { const r = document.documentElement, d = r.dataset.theme === 'dark'; r.dataset.theme = d ? 'light' : 'dark'; $('tTheme').textContent = 'Tema: ' + (d ? 'Açık' : 'Koyu'); };
$('tNet').onclick = () => { st.online = !st.online; $('tNet').classList.toggle('on', st.online); $('tNet').textContent = st.online ? 'Çevrimiçi' : 'Çevrimdışı'; render(); };
$('tYtm').onclick = () => { st.ytm = !st.ytm; $('tYtm').classList.toggle('on', st.ytm); $('tYtm').textContent = st.ytm ? 'YouTube Music girişli' : 'YouTube Music girişsiz'; render(); };

render();
</script>
</body>
</html>
